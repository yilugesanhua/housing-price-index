name: monthly-data-post-publish-monitor

on:
  workflow_dispatch:
    inputs:
      dataset_version:
        description: Published dataset version to verify (YYYY-MM-12hex)
        required: true
        type: string
  workflow_run:
    workflows:
      - monthly-data-auto-publish
      - monthly-data-pending-publish
      - manual-corrected-data-publish
      - historical-data-correction
      - complete-history-data-publish
      - manual-data-rollback
    types: [completed]
  schedule:
    - cron: "43 * * * *"

permissions:
  contents: read

concurrency:
  group: housing-data-production-publish
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      active: ${{ steps.window.outputs.active }}
      control_event_commit_sha: ${{ steps.window.outputs.control_event_commit_sha }}
      control_event_file_name: ${{ steps.window.outputs.control_event_file_name }}
      control_event_run_id: ${{ steps.window.outputs.control_event_run_id }}
      control_event_run_attempt: ${{ steps.window.outputs.control_event_run_attempt }}
      control_event_sha256: ${{ steps.window.outputs.control_event_sha256 }}
      dataset_version: ${{ steps.window.outputs.dataset_version }}
      revision_id: ${{ steps.window.outputs.revision_id }}
      release_audit_sha256: ${{ steps.window.outputs.release_audit_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: window
        env:
          MANUAL_DATASET_VERSION: ${{ inputs.dataset_version || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          TRIGGER_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}
          TRIGGER_WORKFLOW_NAME: ${{ github.event.workflow_run.name || '' }}
        run: node scripts/miniprogram/select-monitor-target.mjs

  monitor:
    needs: inspect
    if: needs.inspect.outputs.active == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: housing-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact default-branch identity before protected credentials are used
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin "$DEFAULT_BRANCH"
          test "$(git rev-parse "origin/$DEFAULT_BRANCH")" = "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the selected immutable control event audit identity
        env:
          CONTROL_EVENT_FILE_NAME: ${{ needs.inspect.outputs.control_event_file_name }}
          EXPECTED_CONTROL_EVENT_COMMIT_SHA: ${{ needs.inspect.outputs.control_event_commit_sha }}
          EXPECTED_CONTROL_EVENT_RUN_ID: ${{ needs.inspect.outputs.control_event_run_id }}
          EXPECTED_CONTROL_EVENT_RUN_ATTEMPT: ${{ needs.inspect.outputs.control_event_run_attempt }}
          EXPECTED_CONTROL_EVENT_SHA256: ${{ needs.inspect.outputs.control_event_sha256 }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFile } from 'node:fs/promises'

          if (!/^(?:20\d{2}-(?:0[1-9]|1[0-2])-[a-f0-9]{12}|(?:manual-data-)?rollback-[0-9TZ-]+)\.json$/.test(process.env.CONTROL_EVENT_FILE_NAME || '')) {
            throw new Error('Selected control event filename is invalid')
          }
          const text = await readFile(`data/releases/${process.env.CONTROL_EVENT_FILE_NAME}`, 'utf8')
          const actual = createHash('sha256').update(text).digest('hex')
          if (actual !== process.env.EXPECTED_CONTROL_EVENT_SHA256) throw new Error('Selected control event audit identity changed')
          const audit = JSON.parse(text)
          if (audit.status === 'rolled_back') {
            if (!/^[1-9]\d*$/.test(process.env.EXPECTED_CONTROL_EVENT_RUN_ATTEMPT || '')
              || audit.audit_schema_version !== 'manual-data-rollback-audit-v4'
              || audit.finalizer_commit_sha !== process.env.EXPECTED_CONTROL_EVENT_COMMIT_SHA
              || String(audit.finalizer_github_run_id || '') !== process.env.EXPECTED_CONTROL_EVENT_RUN_ID
              || String(audit.finalizer_github_run_attempt || '') !== process.env.EXPECTED_CONTROL_EVENT_RUN_ATTEMPT) {
              throw new Error('Selected manual rollback finalizer identity changed')
            }
          } else {
            const auditRunAttempt = audit.github_run_attempt === undefined
              ? ''
              : String(audit.github_run_attempt)
            if (auditRunAttempt && !/^[1-9]\d*$/.test(auditRunAttempt)) throw new Error('Selected control event origin attempt is invalid')
            if (audit.commit_sha !== process.env.EXPECTED_CONTROL_EVENT_COMMIT_SHA
              || String(audit.github_run_id || '') !== process.env.EXPECTED_CONTROL_EVENT_RUN_ID
              || auditRunAttempt !== process.env.EXPECTED_CONTROL_EVENT_RUN_ATTEMPT) {
              throw new Error('Selected control event origin identity changed')
            }
          }
          NODE
      - name: Verify the selected immutable release audit identity
        env:
          DATASET_VERSION: ${{ needs.inspect.outputs.dataset_version }}
          EXPECTED_AUDIT_SHA256: ${{ needs.inspect.outputs.release_audit_sha256 }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFile } from 'node:fs/promises'

          const text = await readFile(`data/releases/${process.env.DATASET_VERSION}.json`, 'utf8')
          const actual = createHash('sha256').update(text).digest('hex')
          if (actual !== process.env.EXPECTED_AUDIT_SHA256) throw new Error('Selected release audit identity changed')
          NODE
      - name: Verify cloud function, pointer, and all 70 remote shards
        env:
          TENCENTCLOUD_MONITOR_SECRET_ID: ${{ secrets.TENCENTCLOUD_MONITOR_SECRET_ID }}
          TENCENTCLOUD_MONITOR_SECRET_KEY: ${{ secrets.TENCENTCLOUD_MONITOR_SECRET_KEY }}
        run: >-
          node scripts/miniprogram/monitor-remote-release.mjs
          --env=cloud1-d3gpdx70w5d05c68c
          --dataset=${{ needs.inspect.outputs.dataset_version }}
      - name: Add monitor result to task summary
        if: always()
        shell: bash
        run: |
          report="work/post-publish-monitor/${{ needs.inspect.outputs.dataset_version }}/monitor-report.json"
          if [ -f "$report" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Post-publish monitor failed before producing a report." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: housing-data-24h-monitor-${{ github.run_id }}
          path: work/post-publish-monitor/
          if-no-files-found: warn
          retention-days: 90
