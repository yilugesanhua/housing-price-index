name: quarterly-historical-page-audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 1 1,4,7,10 *"

permissions:
  contents: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Recheck archived official history without changing data or pointers
        run: npm run data:recheck-historical-pages -- --run-id="${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Publish the read-only audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quarterly-historical-page-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/quarterly-historical-page-audit/
          if-no-files-found: error
          retention-days: 365
