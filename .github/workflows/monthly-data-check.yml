name: monthly-data-check

on:
  workflow_dispatch:
    inputs:
      watchdog_slot:
        description: Deterministic UTC schedule slot supplied by the independent watchdog
        required: false
        type: string
  schedule:
    # 北京时间每天09:00同步官方发布预告；是否检查正式发布列表由预告日期和时间决定。
    - cron: "0 1 * * *"
    # 北京时间每月10日至22日09:27-10:27每5分钟唤醒；脚本只在已核验发布日期访问正式发布列表。
    - cron: "27,32,37,42,47,52,57 1 10-22 * *"
    - cron: "2,7,12,17,22,27,30 2 10-22 * *"
    # 国家统计局偶发改为下午15:00发布时，北京时间14:57-16:00每5分钟唤醒。
    - cron: "57 6 10-22 * *"
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 7 10-22 * *"
    - cron: "0 8 10-22 * *"
    # 高峰窗口外官方偶发延迟时，仅在北京时间12:00和17:00各补查一次。
    - cron: "0 4,9 10-22 * *"

permissions:
  contents: read

concurrency:
  group: monthly-data-check
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read production current pointer (read-only)
        env:
          TENCENTCLOUD_MONITOR_SECRET_ID: ${{ secrets.TENCENTCLOUD_MONITOR_SECRET_ID }}
          TENCENTCLOUD_MONITOR_SECRET_KEY: ${{ secrets.TENCENTCLOUD_MONITOR_SECRET_KEY }}
        run: node scripts/miniprogram/auto-update-state.mjs --read-production-pointer --output=work/monthly-data-check/current.json
      - id: latest
        name: Sync release calendar and compare official and published months
        shell: bash
        run: |
          set +e
          npm run data:check-latest -- --current=work/monthly-data-check/current.json
          status=$?
          set -e
          case "$status" in
            0)
              echo "result=no_update" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "result=update_available" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Official discovery failed with exit $status."
              exit "$status"
              ;;
          esac
      - name: Add report to job summary
        if: always()
        run: |
          if [ -f work/monthly-data-check/report.md ]; then
            cat work/monthly-data-check/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "月度检查未生成报告，请检查官方页面访问和脚本日志。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: monthly-data-check-${{ github.run_id }}
          path: work/monthly-data-check/
          if-no-files-found: warn
          retention-days: 30
      - name: Trigger repository notification on discovery failure
        if: steps.latest.outcome == 'failure'
        run: |
          echo "发布预告逾期、官方页面结构异常或发现程序失败；请查看本次任务摘要和报告。"
          exit 1
