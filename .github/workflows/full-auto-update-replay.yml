name: full-auto-update-replay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: housing-data-full-auto-update-replay
  cancel-in-progress: false

jobs:
  replay:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: housing-data-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact default-branch identity before protected credentials are used
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin "$DEFAULT_BRANCH"
          test "$(git rev-parse "origin/$DEFAULT_BRANCH")" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run isolated full historical replay
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: >-
          npm run miniprogram:data:replay --
          --cloud
          --env=cloud1-d3gpdx70w5d05c68c
          --run-id=${{ github.run_id }}-${{ github.run_attempt }}
          --cloud-run-id=${{ github.run_id }}-${{ github.run_attempt }}
          --months=12
      - name: Add report to task summary
        if: always()
        shell: bash
        run: |
          report="work/full-auto-update-replay/${{ github.run_id }}-${{ github.run_attempt }}/report.json"
          if [ -f "$report" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Full replay failed before producing a report." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: full-auto-update-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/full-auto-update-replay/
          if-no-files-found: warn
          retention-days: 90
