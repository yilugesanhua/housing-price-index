name: cloud-write-rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: housing-data-cloud-write-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: housing-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact default-branch identity before protected credentials are used
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin "$DEFAULT_BRANCH"
          test "$(git rev-parse "origin/$DEFAULT_BRANCH")" = "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and locally verify the current full release package
        shell: bash
        run: |
          mkdir -p work/cloud-write-rehearsal
          node -e "require('fs').writeFileSync('work/cloud-write-rehearsal/calendar.json', JSON.stringify({entries:[{expected_stat_month:'2026-07',scheduled_at:'2026-08-17T01:30:00.000Z'}]},null,2)+'\n')"
          npm run miniprogram:data:stage -- --calendar=work/cloud-write-rehearsal/calendar.json --env=cloud1-d3gpdx70w5d05c68c
          npm run miniprogram:data:verify-remote
      - name: Upload, HEAD, download, and hash-check isolated objects
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: >-
          npm run miniprogram:data:rehearse-write --
          --env=cloud1-d3gpdx70w5d05c68c
          --run-id=${{ github.run_id }}-${{ github.run_attempt }}
      - name: Add result to task summary
        if: always()
        shell: bash
        run: |
          report="work/cloud-write-rehearsal/${{ github.run_id }}-${{ github.run_attempt }}/report.json"
          if [ -f "$report" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Isolated cloud write rehearsal failed before producing a report." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cloud-write-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/cloud-write-rehearsal/
          if-no-files-found: warn
          retention-days: 90
