name: monthly-data-auto-publish

on:
  workflow_run:
    workflows: [monthly-data-check]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: housing-data-production-publish
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      update_available: ${{ steps.discovery.outputs.update_available }}
      repository_release_enabled: ${{ steps.repository_auth.outputs.repository_release_enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact discovery artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: monthly-data-check-${{ github.event.workflow_run.id }}
          path: work/discovery-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - id: discovery
        name: Distinguish a verified update from a normal no-update check
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { isSameReleaseHandled } from './scripts/miniprogram/auto-update-inspect.mjs'
          const report = JSON.parse(readFileSync('work/discovery-artifact/report.json', 'utf8'))
          let updateAvailable = false
          if (report.status === 'update_available') {
            const handoff = JSON.parse(readFileSync('work/discovery-artifact/handoff.json', 'utf8'))
            if (report.official_release_detected !== true || handoff.format !== 'housing-data-discovery-handoff-v1' || handoff.status !== 'update_available') {
              throw new Error('Discovery update is missing a valid machine handoff')
            }
            let state = null
            try { state = JSON.parse(readFileSync('data/releases/auto-update-state.json', 'utf8')) } catch (error) { if (error.code !== 'ENOENT') throw error }
            let pending = null
            try { pending = JSON.parse(readFileSync('data/releases/pending-auto-release.json', 'utf8')) } catch (error) { if (error.code !== 'ENOENT') pending = null }
            const sameRelease = isSameReleaseHandled({ state, pending, handoff })
            updateAvailable = !sameRelease
          } else if (!['waiting', 'current'].includes(report.status)) {
            throw new Error(`Unexpected successful discovery status: ${report.status}`)
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `update_available=${updateAvailable}\n`)
          NODE
      - id: repository_auth
        name: Capture repository authorization outside the production environment
        env:
          REPOSITORY_RELEASE_ENABLED: ${{ vars.AUTOMATIC_RELEASE_ENABLED }}
          OUTSIDE_ENV_PRODUCTION_AUTHORIZATION: ${{ vars.PRODUCTION_RELEASE_AUTHORIZED }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$OUTSIDE_ENV_PRODUCTION_AUTHORIZATION"
          if [ "$REPOSITORY_RELEASE_ENABLED" = "true" ]; then
            echo "repository_release_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "repository_release_enabled=false" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    needs: inspect
    if: >-
      needs.inspect.result == 'success' &&
      needs.inspect.outputs.update_available == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    timeout-minutes: 45
    outputs:
      candidate_commit_sha: ${{ steps.bind.outputs.candidate_commit_sha }}
      dataset_version: ${{ steps.bind.outputs.dataset_version }}
      gate_report_sha256: ${{ steps.bind.outputs.gate_report_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download exact discovery artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: monthly-data-check-${{ github.event.workflow_run.id }}
          path: work/discovery-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - id: recheck_state
        name: Recheck durable candidate state after acquiring the queue
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { readFileSync, appendFileSync } from 'node:fs'
          import { isSameReleaseHandled } from './scripts/miniprogram/auto-update-inspect.mjs'
          const branch = process.env.DEFAULT_BRANCH
          const readRemoteJson = (path) => {
            try {
              return JSON.parse(execFileSync('git', ['show', `origin/${branch}:${path}`], { encoding: 'utf8' }))
            } catch (error) {
              if (error.status === 128) return null
              throw error
            }
          }
          const handoff = JSON.parse(readFileSync('work/discovery-artifact/handoff.json', 'utf8'))
          const handled = isSameReleaseHandled({
            state: readRemoteJson('data/releases/auto-update-state.json'),
            pending: readRemoteJson('data/releases/pending-auto-release.json'),
            handoff,
          })
          appendFileSync(process.env.GITHUB_OUTPUT, `handled=${handled}\n`)
          NODE
      - run: npx playwright install --with-deps chromium webkit
        if: steps.recheck_state.outputs.handled != 'true'
      - name: Require successful ordinary CI for the base commit or audited failure-state parent
        if: steps.recheck_state.outputs.handled != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Base commit SHA is invalid." >&2
            exit 1
          fi

          # The discovery workflow and the push-triggered ordinary CI can be
          # scheduled at the same time. Wait for the exact base commit's CI
          # instead of treating an in-progress run as a permanent failure.
          # A completed non-success remains fail-closed; no other commit or
          # workflow event can satisfy this gate.
          base_ci_verdict() {
            local runs_json
            runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${BASE_SHA}&per_page=50")"
            BASE_CI_RUNS="$runs_json" BASE_SHA="$BASE_SHA" node --input-type=module -e '
              const runs = JSON.parse(process.env.BASE_CI_RUNS).workflow_runs || []
              const matches = runs.filter((run) => run.head_sha === process.env.BASE_SHA && ["push", "workflow_dispatch"].includes(run.event))
              if (matches.some((run) => run.status === "completed" && run.conclusion === "success")) process.stdout.write("success")
              else if (matches.some((run) => run.status === "completed" && run.conclusion !== "success")) process.stdout.write("failed")
              else process.stdout.write("pending")
            '
          }

          commit_subject="$(git show -s --format=%s "$BASE_SHA")"
          if [ "$commit_subject" != "data: persist failed automated update state" ]; then
            for attempt in $(seq 1 60); do
              verdict="$(base_ci_verdict)"
              case "$verdict" in
                success)
                  exit 0
                  ;;
                failed)
                  echo "Ordinary CI failed for base commit ${BASE_SHA}." >&2
                  exit 1
                  ;;
                pending)
                  if [ "$attempt" -lt 60 ]; then sleep 10; fi
                  ;;
                *)
                  echo "Could not classify ordinary CI for base commit ${BASE_SHA}." >&2
                  exit 1
                  ;;
              esac
            done
            echo "Timed out waiting for ordinary CI for base commit ${BASE_SHA}." >&2
            exit 1
          fi

          # A failed-update persistence commit is created with GITHUB_TOKEN, so
          # GitHub deliberately does not start another workflow for that commit.
          # Reuse CI from its parent only when the commit is mechanically proven
          # to contain nothing except the failed state and its exact raw source.
          parent_sha="$(git rev-parse "${BASE_SHA}^")"
          test "$(git show -s --format=%s "${BASE_SHA}")" = "data: persist failed automated update state"
          changed_count=0
          while IFS= read -r path; do
            changed_count=$((changed_count + 1))
            if [[ ! "$path" =~ ^data/raw/20[0-9]{2}-(0[1-9]|1[0-2])/[0-9a-f]{64}\.(batch\.json|html\.gz)$ && "$path" != "data/releases/auto-update-state.json" ]]; then
              echo "Unexpected path in failed-state persistence commit: $path" >&2
              exit 1
            fi
          done < <(git diff --name-only "${parent_sha}" "${BASE_SHA}")
          test "$changed_count" -gt 0
          parent_count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${parent_sha}&status=completed&per_page=20" --jq ".workflow_runs | map(select(.head_sha == \"${parent_sha}\" and .conclusion == \"success\")) | length")"
          test "$parent_count" -gt 0
          export PARENT_SHA="$parent_sha"
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          const state = JSON.parse(execFileSync('git', ['show', `${process.env.BASE_SHA}:data/releases/auto-update-state.json`], { encoding: 'utf8' }))
          if (state.format !== 'housing-data-auto-update-state-v1' || state.status !== 'failed') throw new Error('base commit is not a failed automatic-update state')
          if (!/^20\d{2}-(0[1-9]|1[0-2])$/.test(state.dataset_as_of || '') || !/^[a-f0-9]{64}$/.test(state.source_raw_sha256 || '') || state.release_key !== `${state.dataset_as_of}-${state.source_raw_sha256}`) throw new Error('failed state source identity is invalid')
          if (!Number.isFinite(Date.parse(state.time_seed || '')) || !Number.isFinite(Date.parse(state.next_check_at || ''))) throw new Error('failed state timing identity is invalid')
          NODE
      - name: Re-fetch official schedule and release list
        if: steps.recheck_state.outputs.handled != 'true'
        env:
          TENCENTCLOUD_MONITOR_SECRET_ID: ${{ secrets.TENCENTCLOUD_MONITOR_SECRET_ID }}
          TENCENTCLOUD_MONITOR_SECRET_KEY: ${{ secrets.TENCENTCLOUD_MONITOR_SECRET_KEY }}
        shell: bash
        run: |
          set +e
          node scripts/miniprogram/auto-update-state.mjs --read-production-pointer --output=work/monthly-data-check/current.json
          npm run data:check-latest -- --current=work/monthly-data-check/current.json
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "Fresh discovery did not confirm exactly one available update (exit $status)."
            exit 1
          fi
      - name: Record trusted workflow-run context
        if: steps.recheck_state.outputs.handled != 'true'
        env:
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          node -e "const fs=require('fs'); fs.mkdirSync('work/auto-release',{recursive:true});
          fs.writeFileSync('work/auto-release/trigger.json', JSON.stringify({workflow_name:process.env.TRIGGER_WORKFLOW,
          conclusion:process.env.TRIGGER_CONCLUSION,event:process.env.TRIGGER_EVENT,
          head_branch:process.env.TRIGGER_HEAD_BRANCH,head_sha:process.env.TRIGGER_HEAD_SHA,
          run_id:process.env.TRIGGER_RUN_ID,default_branch:process.env.DEFAULT_BRANCH},null,2)+'\n')"
      - name: Validate discovery handoff against fresh official data
        if: steps.recheck_state.outputs.handled != 'true'
        run: >-
          npm run data:validate-handoff --
          --handoff=work/discovery-artifact/handoff.json
          --discovery-report=work/discovery-artifact/report.json
          --discovery-calendar=work/discovery-artifact/release-calendar.json
          --fresh-report=work/monthly-data-check/report.json
          --calendar=work/monthly-data-check/release-calendar.json
          --trigger=work/auto-release/trigger.json
      - name: Fetch, audit, build, and test candidate
        if: steps.recheck_state.outputs.handled != 'true'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: >-
          npm run miniprogram:data:prepare-auto --
          --discovery-gate=work/auto-release/discovery-gate.json
          --calendar=work/monthly-data-check/release-calendar.json
          --env=cloud1-d3gpdx70w5d05c68c
      - name: Stage only allowlisted generated files
        if: steps.recheck_state.outputs.handled != 'true'
        run: npm run miniprogram:data:persist-candidate -- --gate=work/auto-release/gate-report.json
      - name: Commit durable candidate state
        if: steps.recheck_state.outputs.handled != 'true'
        env:
          EXPECTED_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          git config user.name "housing-data-automation"
          git config user.email "housing-data-automation@users.noreply.github.com"
          git commit -m "data: prepare automated monthly release"
          git push origin "HEAD:${EXPECTED_BRANCH}"
      - id: dispatch_candidate_ci
        name: Trigger ordinary CI for the exact candidate commit
        if: steps.recheck_state.outputs.handled != 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          git fetch origin "$DEFAULT_BRANCH"
          test "$(git rev-parse "origin/$DEFAULT_BRANCH")" = "$candidate_sha"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref="$DEFAULT_BRANCH"
      - id: candidate_ci
        name: Require successful ordinary CI for the exact candidate commit
        if: steps.recheck_state.outputs.handled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          export CANDIDATE_SHA="$candidate_sha"
          for attempt in $(seq 1 60); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${candidate_sha}&per_page=50" > work/auto-release/candidate-ci-runs.json
            set +e
            node - <<'NODE'
            const fs = require('fs')
            const runs = JSON.parse(fs.readFileSync('work/auto-release/candidate-ci-runs.json', 'utf8')).workflow_runs || []
            const matches = runs.filter((run) => run.head_sha === process.env.CANDIDATE_SHA && ['push', 'workflow_dispatch'].includes(run.event))
            const failed = matches.find((run) => run.status === 'completed' && run.conclusion !== 'success')
            if (failed) throw new Error(`Candidate ordinary CI failed: ${failed.id} (${failed.conclusion})`)
            const successful = matches.find((run) => run.status === 'completed' && run.conclusion === 'success')
            if (!successful) process.exit(2)
            const evidence = { workflow: 'ci.yml', event: successful.event, conclusion: 'success', run_id: String(successful.id), commit_sha: successful.head_sha, verified_at: new Date().toISOString() }
            fs.writeFileSync('work/auto-release/ordinary-ci-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`)
            NODE
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then break; fi
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            sleep 10
          done
          test -s work/auto-release/ordinary-ci-evidence.json
        env:
          GH_TOKEN: ${{ github.token }}
      - id: bind
        name: Bind production gate to pushed candidate commit
        if: steps.recheck_state.outputs.handled != 'true'
        shell: bash
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          binding="$(npm run --silent miniprogram:data:bind-gate -- --gate=work/auto-release/gate-report.json --commit="$candidate_sha" --ordinary-ci=work/auto-release/ordinary-ci-evidence.json)"
          node -e "const v=JSON.parse(process.argv[1]); const fs=require('fs'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'candidate_commit_sha='+v.commit_sha+'\ndataset_version='+v.dataset_version+'\ngate_report_sha256='+v.gate_report_sha256+'\n')" "$binding"
      - name: Upload reproducible candidate and gate reports
        if: always() && steps.recheck_state.outputs.handled != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: housing-data-candidate-${{ github.run_id }}
          path: |
            work/auto-release/
            work/monthly-data-check/
            work/discovery-artifact/
          if-no-files-found: error
          retention-days: 90
      - name: Persist failed automatic-update state and source evidence
        if: failure() && steps.recheck_state.outputs.handled != 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(npm run --silent miniprogram:data:persist-state -- --error="automatic update workflow failed in run ${GITHUB_RUN_ID}")"
          persisted="$(node -e "const v=JSON.parse(process.argv[1]); process.stdout.write(String(v.persisted === true))" "$result")"
          if [ "$persisted" != "true" ]; then
            exit 0
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "housing-data-automation"
          git config user.email "housing-data-automation@users.noreply.github.com"
          git commit -m "data: persist failed automated update state"
          git push origin "HEAD:${DEFAULT_BRANCH}"

  publish:
    needs: [inspect, prepare]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.candidate_commit_sha != '' && needs.inspect.outputs.repository_release_enabled == 'true'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: housing-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify candidate is the exact default-branch head
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_commit_sha }}
        shell: bash
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "origin/$DEFAULT_BRANCH")" = "$CANDIDATE_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: housing-data-candidate-${{ github.run_id }}
          path: work
      - name: Publish immutable release, guard, and auto-rollback on failure
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          AUTOMATIC_RELEASE_ENABLED: ${{ needs.inspect.outputs.repository_release_enabled }}
          PRODUCTION_RELEASE_AUTHORIZED: ${{ vars.PRODUCTION_RELEASE_AUTHORIZED }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_COMMIT_SHA: ${{ needs.prepare.outputs.candidate_commit_sha }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_DISCOVERY_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_PRODUCTION_ENVIRONMENT: housing-data-production
          CI_CLOUD_ENV_ID: cloud1-d3gpdx70w5d05c68c
          CI_DATASET_VERSION: ${{ needs.prepare.outputs.dataset_version }}
          CI_GATE_REPORT_SHA256: ${{ needs.prepare.outputs.gate_report_sha256 }}
          CI_GATE_REPORT_PATH: work/auto-release/gate-report.json
        run: >-
          npm run miniprogram:data:publish --
          --env=cloud1-d3gpdx70w5d05c68c
          --dataset=${{ needs.prepare.outputs.dataset_version }}
      - id: rollback_monitor_event
        name: Validate a successful automatic rollback for monitor registration
        if: failure()
        env:
          EXPECTED_COMMIT_SHA: ${{ needs.prepare.outputs.candidate_commit_sha }}
          EXPECTED_GITHUB_RUN_ID: ${{ github.run_id }}
          EXPECTED_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/miniprogram/register-monitor-control-event.mjs
      - name: Persist the automatic rollback monitor event without cloud credentials
        if: failure() && steps.rollback_monitor_event.outputs.registered == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_PATH: ${{ steps.rollback_monitor_event.outputs.event_path }}
          FAILURE_PATH: ${{ steps.rollback_monitor_event.outputs.failure_path }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "housing-data-automation"
          git config user.email "housing-data-automation@users.noreply.github.com"
          git add -- "$EVENT_PATH" "$FAILURE_PATH"
          git commit -m "data: record automatic rollback monitor event"
          git push origin "HEAD:${DEFAULT_BRANCH}"
      - name: Publish immutable private audit package
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          CI_COMMIT_SHA: ${{ needs.prepare.outputs.candidate_commit_sha }}
        run: >-
          npm run miniprogram:data:publish-audit --
          --env=cloud1-d3gpdx70w5d05c68c
          --dataset=${{ needs.prepare.outputs.dataset_version }}
      - name: Persist publish audit and clear pending state
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          npm run miniprogram:data:complete-auto -- --dataset=${{ needs.prepare.outputs.dataset_version }}
          git config user.name "housing-data-automation"
          git config user.email "housing-data-automation@users.noreply.github.com"
          git add -- "data/releases/${{ needs.prepare.outputs.dataset_version }}.json" data/releases/pending-auto-release.json data/releases/latest-auto-release.json data/releases/auto-update-state.json
          git commit -m "data: record automated monthly release"
          git push origin "HEAD:${DEFAULT_BRANCH}"
      - name: Upload publish and rollback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: housing-data-publish-audit-${{ github.run_id }}
          path: |
            data/releases/
            work/auto-release/
          if-no-files-found: error
          retention-days: 365
