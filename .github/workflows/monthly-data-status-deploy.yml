name: monthly-data-status-deploy

on:
  workflow_run:
    workflows: [monthly-data-check]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: housing-data-production-publish
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == github.event.repository.default_branch && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_commit_sha: ${{ steps.identity.outputs.source_commit_sha }}
      source_run_id: ${{ steps.identity.outputs.source_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        name: Lock the trusted discovery run identity
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT_SHA"
          echo "source_commit_sha=$SOURCE_COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked workflow dependencies
        run: npm ci
      - name: Download the exact discovery artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: monthly-data-check-${{ github.event.workflow_run.id }}
          path: work/discovery-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate the immutable observation artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s work/discovery-artifact/cloud-observation.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          import { validateObservationPayload } from './scripts/miniprogram/cloud-observation-gate.mjs'
          const observation = JSON.parse(await readFile('work/discovery-artifact/cloud-observation.json', 'utf8'))
          validateObservationPayload(observation)
          NODE

  deploy:
    needs: inspect
    if: needs.inspect.result == 'success' && vars.AUTOMATIC_RELEASE_ENABLED == 'true'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: housing-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.inspect.outputs.source_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked workflow dependencies
        run: npm ci
      - name: Require the source commit to remain the exact default-branch head
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ needs.inspect.outputs.source_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse "origin/$DEFAULT_BRANCH")" = "$EXPECTED_SHA"
      - name: Download the exact inspected discovery artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: monthly-data-check-${{ needs.inspect.outputs.source_run_id }}
          path: work/discovery-artifact
          github-token: ${{ github.token }}
          run-id: ${{ needs.inspect.outputs.source_run_id }}
      - name: Deploy only the verified data status
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          AUTOMATIC_RELEASE_ENABLED: ${{ vars.AUTOMATIC_RELEASE_ENABLED }}
          PRODUCTION_RELEASE_AUTHORIZED: ${{ vars.PRODUCTION_RELEASE_AUTHORIZED }}
          CI_PRODUCTION_ENVIRONMENT: housing-data-production
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_COMMIT_SHA: ${{ needs.inspect.outputs.source_commit_sha }}
        run: >-
          npm run miniprogram:data:deploy-status --
          --observation=work/discovery-artifact/cloud-observation.json
          --env=cloud1-d3gpdx70w5d05c68c
          --output=work/data-status-deployment/receipt.json
      - name: Upload non-sensitive status deployment receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: housing-data-status-deployment-${{ github.run_id }}
          path: work/data-status-deployment/
          if-no-files-found: warn
          retention-days: 90
