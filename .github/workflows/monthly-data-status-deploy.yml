name: monthly-data-status-deploy

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact successful monthly-data-check run ID for the current main commit
        required: true
        type: string
      confirmation:
        description: Type status-deployment-rehearsal to run the limited production status rehearsal
        required: true
        type: string
  workflow_run:
    workflows: [monthly-data-check]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: housing-data-production-publish
  cancel-in-progress: false

jobs:
  reject-non-default-ref:
    if: github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject a manual status rehearsal outside the default branch
        shell: bash
        run: |
          set -euo pipefail
          echo 'Status rehearsal is allowed only from the default branch.' >&2
          exit 1

  inspect:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == github.event.repository.default_branch && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_commit_sha: ${{ steps.identity.outputs.source_commit_sha }}
      source_run_id: ${{ steps.identity.outputs.source_run_id }}
    steps:
      - id: identity
        name: Lock the trusted discovery run identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_WORKFLOW_SHA: ${{ github.sha }}
          SOURCE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')

          const fail = (message) => { throw new Error(`Trusted discovery run rejected: ${message}`) }
          const assert = (condition, message) => { if (!condition) fail(message) }
          const shaPattern = /^[0-9a-f]{40}$/
          const runIdPattern = /^[0-9]+$/
          let sourceCommitSha = process.env.SOURCE_COMMIT_SHA
          const sourceRunId = process.env.SOURCE_RUN_ID

          assert(runIdPattern.test(sourceRunId || ''), 'source run ID is invalid')
          if (process.env.EVENT_NAME === 'workflow_dispatch') {
            const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${sourceRunId}`, {
              headers: {
                authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                accept: 'application/vnd.github+json',
                'x-github-api-version': '2022-11-28',
              },
            })
            if (!response.ok) fail(`cannot read source run: HTTP ${response.status}`)
            const run = await response.json()
            assert(run.path === '.github/workflows/monthly-data-check.yml', 'source workflow path is invalid')
            assert(run.status === 'completed' && run.conclusion === 'success', 'source run is not successful')
            assert(run.head_branch === process.env.DEFAULT_BRANCH, 'source run is not from the default branch')
            assert(['schedule', 'workflow_dispatch'].includes(run.event), 'source run event is invalid')
            sourceCommitSha = run.head_sha
            assert(sourceCommitSha === process.env.CURRENT_WORKFLOW_SHA, 'source run is not bound to the current default-branch commit')
          }

          assert(shaPattern.test(sourceCommitSha || ''), 'source commit SHA is invalid')
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_commit_sha=${sourceCommitSha}\nsource_run_id=${sourceRunId}\n`)
          NODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.identity.outputs.source_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconfirm the checked-out source identity
        env:
          SOURCE_COMMIT_SHA: ${{ steps.identity.outputs.source_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT_SHA"
      - name: Confirm rehearsal intent before any protected job can start
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'status-deployment-rehearsal'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked workflow dependencies
        run: npm ci
      - name: Download the exact discovery artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: monthly-data-check-${{ steps.identity.outputs.source_run_id }}
          path: work/discovery-artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.identity.outputs.source_run_id }}
      - name: Validate the immutable observation artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s work/discovery-artifact/cloud-observation.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          import { validateObservationPayload } from './scripts/miniprogram/cloud-observation-gate.mjs'
          const observation = JSON.parse(await readFile('work/discovery-artifact/cloud-observation.json', 'utf8'))
          validateObservationPayload(observation)
          NODE

  deploy:
    needs: inspect
    if: >-
      needs.inspect.result == 'success' &&
      ((github.event_name == 'workflow_run' && vars.AUTOMATIC_RELEASE_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'status-deployment-rehearsal' && vars.AUTOMATIC_RELEASE_ENABLED == 'false'))
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: housing-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.inspect.outputs.source_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked workflow dependencies
        run: npm ci
      - name: Require the source commit to remain the exact default-branch head
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ needs.inspect.outputs.source_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse "origin/$DEFAULT_BRANCH")" = "$EXPECTED_SHA"
      - name: Download the exact inspected discovery artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: monthly-data-check-${{ needs.inspect.outputs.source_run_id }}
          path: work/discovery-artifact
          github-token: ${{ github.token }}
          run-id: ${{ needs.inspect.outputs.source_run_id }}
      - name: Deploy only the verified data status
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          AUTOMATIC_RELEASE_ENABLED: ${{ vars.AUTOMATIC_RELEASE_ENABLED }}
          PRODUCTION_RELEASE_AUTHORIZED: ${{ vars.PRODUCTION_RELEASE_AUTHORIZED }}
          CI_PRODUCTION_ENVIRONMENT: housing-data-production
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_COMMIT_SHA: ${{ needs.inspect.outputs.source_commit_sha }}
          CI_STATUS_DEPLOYMENT_MODE: ${{ github.event_name == 'workflow_dispatch' && 'rehearsal' || 'release' }}
          CI_STATUS_DEPLOYMENT_REHEARSAL_CONFIRMATION: ${{ inputs.confirmation || '' }}
        run: >-
          npm run miniprogram:data:deploy-status --
          --observation=work/discovery-artifact/cloud-observation.json
          --env=cloud1-d3gpdx70w5d05c68c
          --output=work/data-status-deployment/receipt.json
      - name: Upload non-sensitive status deployment receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: housing-data-status-deployment-${{ github.run_id }}
          path: work/data-status-deployment/
          if-no-files-found: warn
          retention-days: 90
