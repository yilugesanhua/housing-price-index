name: monthly-data-candidate-cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: housing-data-production-publish
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: housing-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Delete only the failed July candidate after protecting the June pointer
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          node scripts/miniprogram/delete-remote-candidate.mjs
          --env=cloud1-d3gpdx70w5d05c68c
          --dataset=2026-07-5da3c160c5e3
          --expected-current=2026-06-f80465ae29a5
      - name: Upload non-sensitive cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monthly-data-candidate-cleanup-${{ github.run_id }}
          path: work/candidate-cleanup/report.json
          if-no-files-found: warn
          retention-days: 365
