name: miniprogram-15-year-preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: housing-data-15-year-preview
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: housing-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact default-branch identity before isolated credentials are used
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin "$DEFAULT_BRANCH"
          test "$(git rev-parse "origin/$DEFAULT_BRANCH")" = "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild the local 15-year preview candidate
        run: |
          npm run miniprogram:data:complete
          npm run data:release-calendar
          npm run test:miniprogram
      - name: Deploy the isolated preview manifest function
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          npx tcb login --apiKeyId "$TENCENTCLOUD_SECRET_ID" --apiKey "$TENCENTCLOUD_SECRET_KEY" --json
          npm run miniprogram:cloud:deploy-preview
      - name: Upload and verify the isolated 15-year preview package
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: npm run miniprogram:data:publish-preview
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: miniprogram-15-year-preview-${{ github.run_id }}
          path: |
            work/miniprogram-preview-function/
            work/miniprogram-preview-data/
          if-no-files-found: warn
          retention-days: 90
